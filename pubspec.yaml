name: srik_cli
description: Flutter project scaffolder. Choose architecture (Clean, MVVM, Feature-first, Simple), design preset, gradients, and spacing. Generate projects and add features.
version: 0.2.0
homepage: https://github.com/srisivas/srik_cli
repository: https://github.com/srisivas/srik_cli
issue_tracker: https://github.com/srisivas/srik_cli/issues
topics:
  - flutter
  - cli
  - scaffolding
  - clean-architecture
  - riverpod

environment:
  sdk: ">=3.0.0 <4.0.0"

executables:
  srik: srik

dependencies:
  args: ^2.5.0
  interact: ^2.2.0
  path: ^1.9.0
  yaml: ^3.1.2

dev_dependencies:
  test: ^1.25.0
  lints: ^4.0.0
